<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन कंट्रोल स्टोर (Dynamic Product Manager)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 20px;
        }

        /* Admin Panel Styling */
        .admin-panel {
            max-width: 900px;
            background: #ffffff;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #27ae60;
        }

        .admin-panel h2 {
            color: #27ae60;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #27ae60;
            outline: none;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #219150;
        }

        .btn-cancel {
            background-color: #95a5a6;
            display: none;
        }

        .btn-cancel:hover {
            background-color: #7f8c8d;
        }

        /* Products Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 40px auto;
        }

        .product-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.1rem;
            color: #e67e22;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-edit-card {
            background-color: #3498db;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-delete-card {
            background-color: #e74c3c;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        /* Sections */
        .section-container {
            max-width: 900px;
            background: #ffffff;
            margin: 0 auto 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .review-item, .comment-item {
            border-bottom: 1px solid #eeeeee;
            padding: 10px 0;
        }

        .stars {
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <h1>ऑर्गेनिक स्टोर - मैनेजमेंट सिस्टम</h1>

    <!-- ADMIN CONTROL PANEL (ADD & EDIT FORM) -->
    <div class="admin-panel">
        <h2 id="formTitle">🛠️ नया प्रोडक्ट जोड़ें (Add New Product)</h2>
        <form id="productForm">
            <input type="hidden" id="productId"> <!-- Hidden Field for Tracking Edit ID -->
            
            <div class="form-row">
                <div class="form-group">
                    <label>प्रोडक्ट का नाम:</label>
                    <input type="text" id="pName" placeholder="जैसे: गाय का देसी घी" required>
                </div>
                <div class="form-group">
                    <label>कीमत/रेट (Price):</label>
                    <input type="text" id="pPrice" placeholder="जैसे: ₹1400 / लीटर या ₹40 (1 पीस)" required>
                </div>
            </div>

            <div class="form-group">
                <label>फोटो का URL/लिंक (Image Link):</label>
                <input type="url" id="pImg" placeholder="https://example.com/image.jpg" required>
            </div>

            <div class="form-group">
                <label>विवरण (Description):</label>
                <textarea id="pDesc" rows="2" placeholder="प्रोडक्ट की खासियत लिखें..." required></textarea>
            </div>

            <button type="submit" id="saveBtn" class="btn">प्रोडक्ट सेव करें</button>
            <button type="button" id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">रद्द करें (Cancel)</button>
        </form>
    </div>

    <!-- PRODUCTS DISPLAY AREA -->
    <h2>उपलब्ध प्रोडक्ट्स (Store Front)</h2>
    <div class="product-grid" id="productGrid">
        <!-- Javascript products render space -->
    </div>

    <!-- REVIEWS SECTION -->
    <div class="section-container">
        <h2>⭐ ग्राहक रिव्यू (Customer Reviews)</h2>
        <form id="reviewForm">
            <div class="form-row">
                <div class="form-group">
                    <label>नाम:</label>
                    <input type="text" id="reviewName" required placeholder="अपना नाम दर्ज करें">
                </div>
                <div class="form-group">
                    <label>रेटिंग:</label>
                    <select id="reviewRating">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                        <option value="2">⭐⭐ (2/5)</option>
                        <option value="1">⭐ (1/5)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>समीक्षा (Review):</label>
                <textarea id="reviewText" rows="2" required placeholder="अपनी राय लिखें"></textarea>
            </div>
            <button type="submit" class="btn">रिव्यू सबमिट करें</button>
        </form>

        <div id="reviewList" style="margin-top: 20px;"></div>
    </div>

    <!-- COMMENTS SECTION -->
    <div class="section-container">
        <h2>💬 सवाल और कमेंट्स (Comments)</h2>
        <form id="commentForm">
            <div class="form-group">
                <label>नाम:</label>
                <input type="text" id="commentName" required placeholder="आपका नाम">
            </div>
            <div class="form-group">
                <label>कमेंट:</label>
                <textarea id="commentText" rows="2" required placeholder="कोई प्रश्न या विचार लिखें"></textarea>
            </div>
            <button type="submit" class="btn">कमेंट पोस्ट करें</button>
        </form>

        <div id="commentList" style="margin-top: 20px;"></div>
    </div>

    <script>
        // Default Products Data
        const defaultProducts = [
            { id: 1, name: "गाय का देसी घी", price: "₹1400 / लीटर", desc: "100% शुद्ध ए2 गाय का घी", image: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=500" },
            { id: 2, name: "भैंस का शुद्ध घी", price: "₹1200 / लीटर", desc: "ताज़ा और गाढ़ा भैंस का घी", image: "https://images.unsplash.com/photo-1628088062854-d1870b4553da?w=500" },
            { id: 3, name: "नीम हर्बल साबुन", price: "₹40 (1 पीस) | ₹130 (4 पैक)", desc: "त्वचा सुरक्षा व एंटी-बैक्टीरियल", image: "https://images.unsplash.com/photo-1607006344380-b6775a0824a7?w=500" },
            { id: 4, name: "एलोवेरा साबुन", price: "₹40 (1 पीस) | ₹130 (4 पैक)", desc: "त्वचा को ठंडक और नमी प्रदान करे", image: "https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=500" },
            { id: 5, name: "संतरा साबुन", price: "₹40 (1 पीस) | ₹130 (4 पैक)", desc: "विटामिन सी से भरपूर ताज़गी", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500" }
        ];

        // Load Products from LocalStorage or Default
        let products = JSON.parse(localStorage.getItem('myProducts')) || defaultProducts;

        // Display Products in Grid
        function displayProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${product.image}" alt="${product.name}">
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.desc}</div>
                            <div class="product-price">${product.price}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-edit-card" onclick="editProduct(${product.id})">✏️ एडिट</button>
                            <button class="btn btn-delete-card" onclick="deleteProduct(${product.id})">🗑️ हटाएं</button>
                        </div>
                    </div>
                `;
            });

            // Save to browser memory
            localStorage.setItem('myProducts', JSON.stringify(products));
        }

        // Add / Update Product Submit Handler
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const image = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;

            if (id) {
                // Edit Existing Product
                const productIndex = products.findIndex(p => p.id == id);
                products[productIndex] = { id: Number(id), name, price, image, desc };
            } else {
                // Add New Product
                const newProduct = {
                    id: Date.now(), // Generate Unique ID
                    name,
                    price,
                    image,
                    desc
                };
                products.push(newProduct);
            }

            displayProducts();
            resetForm();
        });

        // Edit Product Function
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            
            document.getElementById('productId').value = product.id;
            document.getElementById('pName').value = product.name;
            document.getElementById('pPrice').value = product.price;
            document.getElementById('pImg').value = product.image;
            document.getElementById('pDesc').value = product.desc;

            // Change Form Appearance
            document.getElementById('formTitle').innerText = "✏️ प्रोडक्ट एडिट करें (Edit Product)";
            document.getElementById('saveBtn').innerText = "अपडेट करें (Update)";
            document.getElementById('cancelBtn').style.display = "inline-block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete Product Function
        function deleteProduct(id) {
            if (confirm("क्या आप वाकई इस प्रोडक्ट को हटाना चाहते हैं?")) {
                products = products.filter(p => p.id !== id);
                displayProducts();
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('productId').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('formTitle').innerText = "🛠️ नया प्रोडक्ट जोड़ें (Add New Product)";
            document.getElementById('saveBtn').innerText = "प्रोडक्ट सेव करें";
            document.getElementById('cancelBtn').style.display = "none";
        }

        // Handle Reviews
        document.getElementById('reviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('reviewName').value;
            const rating = document.getElementById('reviewRating').value;
            const text = document.getElementById('reviewText').value;

            document.getElementById('reviewList').innerHTML += `
                <div class="review-item">
                    <strong>${name}</strong> <span class="stars">${'⭐'.repeat(rating)}</span>
                    <p>${text}</p>
                </div>
            `;
            this.reset();
        });

        // Handle Comments
        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('commentName').value;
            const text = document.getElementById('commentText').value;

            document.getElementById('commentList').innerHTML += `
                <div class="comment-item">
                    <strong>${name}</strong>
                    <p>${text}</p>
                </div>
            `;
            this.reset();
        });

        // Initialize display on page load
        displayProducts();
    </script>
</body>
</html>
